# Test profile: an in-memory database and test-only values, so `./mvnw test` needs no PostgreSQL,
# no .env and no environment variables. None of these values is used anywhere else.

server.port=0

spring.datasource.url=jdbc:h2:mem:bookleaf-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Tests build the schema from the entities; the migrations are exercised against PostgreSQL by startup validation.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.auth.secret=test-only-signing-key-that-is-at-least-32-chars
app.auth.token-ttl-minutes=60
app.cors.allowed-origin=http://frontend.test

# No real AI in tests: a fake client replaces the provider client (see TestAiConfig).
app.ai.api-key=
app.ai.provider-name=test-provider
app.ai.model=test-model
app.ai.base-url=http://llm.test/v1

app.ui.brand-name=Test Portal
app.ui.currency-code=INR
app.ui.locale=en-IN

app.seed.author-password=test-author-password-1
app.seed.admin-email=admin@test.example
app.seed.admin-name=Test Admin
app.seed.admin-password=test-admin-password-1
