# Rule-based triage used when the AI is unavailable or returns unusable output (PRD section 7).
# It is a safety net, not a substitute for the AI. Edit this file to change the rules; no code change needed.
#
# Every "patterns" value is a case-insensitive regular expression matched against "subject + description".
# Use \\b for a word boundary (properties files need the backslash doubled).

fallback.reason=AI unavailable; rule-based fallback applied. Manual review needed.

# Category rules are checked in order; the first one that matches wins.
rule.1.category=ISBN_METADATA
rule.1.patterns=isbn
rule.2.category=PRINTING_QUALITY
rule.2.patterns=misprint|print quality|printing|printed|blurry|binding|misaligned|defect|damaged|reprint|author copies|colou?r
rule.3.category=ROYALTY_PAYMENTS
rule.3.patterns=royalt|payout|payment|paid|bank account
# Simple requests to update a description or bio are General Inquiries and Low priority (the brief's
# sample table and PRD section 7: "general metadata updates => Low").
rule.4.category=GENERAL_INQUIRY
rule.4.priority=LOW
rule.4.patterns=metadata|\\bbio\\b|author bio|description|blurb
rule.5.category=DISTRIBUTION_AVAILABILITY
rule.5.patterns=unavailable|not available|out of stock|amazon|flipkart|listing|not showing|stock sync|distribution
rule.6.category=BOOK_STATUS_PRODUCTION
rule.6.patterns=typesetting|cover design|proofread|proof |production|when will|status of my book|manuscript|editing
default.category=GENERAL_INQUIRY

# Language that signals severe, time-sensitive impact or repeated failures. Always Critical.
severe.patterns=legal action|lawyer|legal notice|urgent|immediately|asap|multiple times|several times|no response|no reply|still waiting

# Priority per category. "base" is used unless the "high" rule matches.
# "high.requires" (optional) must also match for High to apply.
priority.ISBN_METADATA.base=MEDIUM
priority.ISBN_METADATA.high.requires=isbn
priority.ISBN_METADATA.high.patterns=wrong|different|duplicate|mismatch|incorrect|another book|error|not matching
priority.ROYALTY_PAYMENTS.base=MEDIUM
priority.ROYALTY_PAYMENTS.high.patterns=not received|haven'?t received|have not received|never received|no royalt|overdue|missing|not paid|haven'?t been paid|still not|delay|\\bmonths\\b
priority.PRINTING_QUALITY.base=MEDIUM
priority.PRINTING_QUALITY.high.patterns=misprint|blurry|defect|misaligned|binding|damaged|terrible|poor|bad quality|torn
default.priority=MEDIUM
