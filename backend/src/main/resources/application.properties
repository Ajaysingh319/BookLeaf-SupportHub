spring.application.name=bookleaf-support-backend

# PostgreSQL (local). The password is read from the DB_PASSWORD environment
# variable and is never stored in this file or in Git.
spring.datasource.url=jdbc:postgresql://localhost:5432/bookleaf_support
spring.datasource.username=bookleaf_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / Spring Data JPA
# "update" creates and adjusts tables for local development. Switch to
# "validate" with Flyway migrations before a production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Health endpoint: GET http://localhost:8080/actuator/health
# Shows "db: UP" when Spring Boot can open a PostgreSQL connection.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Authentication. AUTH_SECRET must be set as an environment variable (at least 32 characters).
app.auth.secret=${AUTH_SECRET}
app.auth.token-ttl-minutes=480

# CORS: the exact frontend origin allowed to call the API.
app.cors.allowed-origin=${CLIENT_ORIGIN:http://localhost:5173}

# Sample data import. Off by default; enable it only for a seed run.
# Demo passwords are for local/assignment use only. They are stored as BCrypt hashes.
app.seed.enabled=false
app.seed.resource=classpath:seed/bookleaf_sample_data.json
app.seed.author-password=${SEED_AUTHOR_PASSWORD:BookLeaf@Demo2026}
app.seed.admin-email=admin@bookleaf.local
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@BookLeaf2026}
