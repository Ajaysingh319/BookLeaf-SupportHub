spring.application.name=bookleaf-support-backend

# Environment-specific values and secrets are never written in this file. They come from
# environment variables, or from a git-ignored .env file in the working directory
# (copy .env.example to .env). Real environment variables take precedence over .env.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# The schema is created by Flyway migrations (src/main/resources/db/migration), not by Hibernate.
# Use "validate" so startup fails if the entities and the migrated schema ever drift apart.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.flyway.enabled=true
# Adopts a database that already has tables but no migration history, treating it as version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Health: reports only UP/DOWN, no component details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Authentication ---
# The session is an HttpOnly cookie signed with AUTH_SECRET. It expires after TOKEN_TTL_MINUTES without
# activity (renewed while the person keeps using the app) and never lives longer than session-max-minutes.
app.auth.secret=${AUTH_SECRET}
app.auth.token-ttl-minutes=${TOKEN_TTL_MINUTES}
app.auth.session-max-minutes=720
app.auth.cookie.name=bookleaf_session
# COOKIE_SECURE=true on HTTPS (production); false only for plain-HTTP local development.
app.auth.cookie.secure=${COOKIE_SECURE}
# Lax or Strict for a same-site deployment (proxy or one service). Cross-site cookies are not supported by modern browsers.
app.auth.cookie.same-site=${COOKIE_SAMESITE}
# Failed sign-ins: 5 per (address, email) or 50 per address lock that key for the lockout period.
app.auth.throttle.max-failed-logins=5
app.auth.throttle.max-failed-logins-per-ip=50
app.auth.throttle.lockout-minutes=15
app.auth.throttle.max-tracked-keys=10000

# --- CORS: the exact frontend origin allowed to call the API ---
app.cors.allowed-origin=${CLIENT_ORIGIN}

# --- Pagination (TDD 6.1: cap page size) ---
app.pagination.default-size=20
app.pagination.max-size=50

# --- Attachments ---
# Types are checked against the file's real content, not its name. Limits apply per file and per ticket.
app.attachments.max-file-bytes=5242880
app.attachments.max-files-per-ticket=5
app.attachments.allowed-types=image/jpeg,image/png,image/webp,application/pdf
# One file per upload request: the request limit is the file limit plus room for the multipart framing.
app.attachments.max-request-bytes=5373952
spring.servlet.multipart.max-file-size=${app.attachments.max-file-bytes}B
spring.servlet.multipart.max-request-size=${app.attachments.max-request-bytes}B

# --- AI (TDD section 7) ---
# The key is read from the server environment only and never reaches the browser. Leave it empty
# to run without AI: tickets get rule-based triage and admins write replies by hand.
app.ai.api-key=${LLM_API_KEY:}
app.ai.provider-name=${LLM_PROVIDER_NAME}
app.ai.model=${LLM_MODEL}
app.ai.base-url=${LLM_BASE_URL}
# Optional. "Thinking" models (for example Gemini 3.x) spend hidden reasoning tokens that count against
# the output limit, which can cut the answer off. Setting a low effort (none, minimal or low) fixes that.
# Leave unset for models that do not support it.
app.ai.reasoning-effort=${LLM_REASONING_EFFORT:}
# Prompt text, the knowledge base and the fallback triage rules are plain files: edit them without a code change.
app.ai.prompts-location=classpath:ai/
app.ai.fallback-rules-location=classpath:ai/fallback-triage.properties
app.ai.connect-timeout-seconds=5
app.ai.read-timeout-seconds=20
# Providers sometimes answer 429 (rate limit) or 503 (busy) for a moment. Retry those quick failures
# once before falling back. Timeouts are not retried, so a slow provider never doubles the wait.
app.ai.max-attempts=2
app.ai.retry-delay-ms=1500
# Triage: deterministic and short (it returns a small JSON object).
app.ai.triage.temperature=0.0
# max-tokens is a ceiling, not a target: the JSON answer is about 30 tokens. The headroom stops a model
# that uses some hidden reasoning from being cut off mid-answer.
app.ai.triage.max-tokens=512
app.ai.triage.description-limit=3000
app.ai.triage.reason-max-length=300
# Drafting: slightly warmer, longer; only runs when an admin asks.
app.ai.draft.temperature=0.3
app.ai.draft.max-tokens=1024
app.ai.draft.description-limit=4000
app.ai.draft.reply-limit=600
app.ai.draft.max-length=4000
app.ai.draft.recent-replies=3

# Background pool used for AI triage after a ticket is saved.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50

# --- Values the browser client reads from GET /api/v1/config ---
app.ui.brand-name=${APP_BRAND_NAME}
# ISO 4217 code (for example EUR). The browser turns it into the right symbol for the locale.
app.ui.currency-code=${APP_CURRENCY_CODE}
app.ui.locale=${APP_LOCALE}
app.ui.ticket-poll-ms=5000
app.ui.list-poll-ms=10000
# How many recent tickets the author dashboard shows.
app.ui.dashboard-recent-tickets=5
# Unresolved tickets older than this many hours are highlighted in the admin queue.
app.ui.stale-ticket-hours=48
# BookLeaf royalty policy figures shown to authors (assignment knowledge base).
app.ui.royalty-payout-days=45
app.ui.minimum-payout=1000
# Book statuses that start with this text are treated as "still in production" (no sales or royalties yet).
app.ui.in-production-status-prefix=In Production

# --- Sample data import. Off by default; enable it only for a seed run. ---
# Account details and demo passwords come from the environment and are only needed when seeding.
app.seed.enabled=false
app.seed.resource=classpath:seed/bookleaf_sample_data.json
app.seed.author-password=${SEED_AUTHOR_PASSWORD:}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-name=${SEED_ADMIN_NAME:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
